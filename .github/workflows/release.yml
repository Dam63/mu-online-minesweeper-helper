name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Build PyInstaller (and its bootloader) from source: avoids the antivirus
          # false positives common with the prebuilt bootloader.
          pip install --no-binary pyinstaller pyinstaller
      - name: Run solver tests
        run: python test_solver.py
      - name: Build
        run: >
          pyinstaller --noconfirm --clean --windowed --onefile
          --name MUOnlineMinesweeperHelper
          --add-data "assets;assets" --add-data "templates;templates"
          --collect-all windows_capture --hidden-import win32timezone
          app.pyw
      - uses: actions/upload-artifact@v4
        with:
          name: MUOnlineMinesweeperHelper
          path: dist/MUOnlineMinesweeperHelper.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MUOnlineMinesweeperHelper.exe
          generate_release_notes: true
